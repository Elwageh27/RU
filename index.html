<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7b6d2">
  <title>رسالة صغيرة ليكي 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      display: grid; place-items: center; padding: 24px;
      font-family: Tahoma, Arial, sans-serif; color: #71334f;
      background:
        radial-gradient(circle at 12% 18%, #fff 0 3px, transparent 4px),
        radial-gradient(circle at 85% 22%, #fff8 0 5px, transparent 6px),
        linear-gradient(135deg, #ffe6f0, #f8c5dc 48%, #fcecf4);
      background-size: 100% 100%;
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .heart { position: absolute; color: #e77eaa; opacity: .45; animation: float 9s linear infinite; }
    .heart:nth-child(1){left:8%;font-size:25px;animation-delay:0s}
    .heart:nth-child(2){left:26%;font-size:18px;animation-delay:2s}
    .heart:nth-child(3){left:72%;font-size:30px;animation-delay:1s}
    .heart:nth-child(4){left:91%;font-size:20px;animation-delay:4s}
    @keyframes float { from { transform:translateY(110vh) rotate(0); } to { transform:translateY(-15vh) rotate(360deg); } }
    .card {
      width: min(100%, 680px); text-align: center; padding: clamp(25px, 6vw, 48px);
      border: 1px solid #ffffffb8; border-radius: 30px;
      background: #ffffffb8; box-shadow: 0 18px 55px #b65b8230;
      backdrop-filter: blur(12px); position: relative;
    }
    .top-heart { font-size: 42px; margin-bottom: 8px; }
    h1 { font-size: clamp(25px, 5vw, 38px); margin: 0 0 12px; color: #a83f70; }
    .intro { font-size: clamp(15px, 2.5vw, 18px); line-height: 1.9; margin: 0 auto 25px; max-width: 470px; }
    button {
      border: 0; border-radius: 999px; padding: 15px 38px; cursor: pointer;
      color: white; font-size: 19px; font-weight: bold;
      background: linear-gradient(135deg, #ed78aa, #c94e86);
      box-shadow: 0 9px 22px #c94e8645; transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 13px 27px #c94e8660; }
    button:active { transform: scale(.98); }
    .video-wrap { display: none; margin-top: 26px; animation: appear .6s ease both; }
    .video-wrap.show { display: block; }
    @keyframes appear { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
    .video-title { font-size: clamp(23px, 5vw, 32px); color: #a83f70; font-weight: bold; margin: 0 0 16px; }
    video { width: 100%; max-height: 65vh; border-radius: 19px; background: #28151f; box-shadow: 0 10px 30px #75334b25; }
    .hint { font-size: 13px; color: #98617a; margin-top: 13px; }
    @media (max-width: 480px) { body { padding: 14px; } .card { border-radius: 23px; } button { width: 100%; } }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart">♡</span><span class="heart">♥</span><span class="heart">♡</span><span class="heart">♥</span>
  </div>
  <main class="card">
    <div class="top-heart"></div>
    <h1></h1>
    <p class="intro"> دوسي على الزرار بس </p>
    <button id="openBtn" type="button">اضغطي هنا </button>
    <section class="video-wrap" id="videoWrap">
      <p class="video-title">بس لسهه زعلاااااااااااااااااااااان والله  وعاايز اتصاااااااااااالح  </p>
      <video id="myVideo" controls playsinline preload="metadata">
        <source src="reconciliation-video.mp4" type="video/mp4">
        المتصفح لا يدعم تشغيل الفيديو.
      </video>
      <div class="hint">حمود</div>
    </section>
  </main>
  <script>
    const btn = document.getElementById('openBtn');
    const wrap = document.getElementById('videoWrap');
    const video = document.getElementById('myVideo');
    btn.addEventListener('click', async () => {
      wrap.classList.add('show');
      btn.textContent = '💗';
      btn.disabled = true;
      wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      try { await video.play(); }
      catch (e) { /* بعض المتصفحات قد تحتاج ضغطة تشغيل من داخل الفيديو */ }
    });
  </script>
</body>
</html>
